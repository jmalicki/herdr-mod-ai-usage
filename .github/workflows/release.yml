name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify version tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          expected = 'v' + Path('VERSION').read_text().strip()
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'Tag {actual!r} does not match VERSION ({expected!r})')
          PY
      - name: Package release
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: python build_release.py --name "$PROJECT_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --verify-tag --generate-notes
